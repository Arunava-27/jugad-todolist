services:
  app:
    image: ghcr.io/arunava-27/jugad-todolist:latest
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY}
      DOMAIN: ${DOMAIN}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    volumes:
      - app-data:/data
    expose:
      - "3000"
    healthcheck:
      # Readiness, not just liveness — fails if the process is up but can't
      # actually reach its own database. No curl in node:20-slim, so this
      # uses Node's built-in http client instead of adding a dependency.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
