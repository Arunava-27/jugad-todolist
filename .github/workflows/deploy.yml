name: Deploy

# CI (build-web) runs on every push to main; CD (build-and-push + deploy) only
# runs once that passes, so a broken build never reaches the droplet.
on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/arunava-27/jugad-todolist

jobs:
  build-web:
    name: Build frontend (CI check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix web install
      - run: npm --prefix web run build

  build-and-push:
    name: Build & push image
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull new image and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/jugad-todolist
            docker compose pull app
            docker compose up -d
            docker image prune -f
